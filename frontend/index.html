<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dropshipping Profit Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 40px auto;
}
input, button {
  padding: 8px;
  margin: 5px 0;
  width: 100%;
}
button {
  background: #a30f0f;
  color: white;
  border: none;
  cursor: pointer;
}
button:hover {
  opacity: 0.9;
}
pre {
  background: #111;
  color: #0f0;
  padding: 10px;
}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

</head>

<body>

<h2>Dropshipping Profit Calculator (2026-04-24)</h2>

<h3>Login</h3>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button id="loginBtn">Login</button>
<button id="logoutBtn">Logout</button>

<div id="loginStatus">Not logged in</div>

<hr>

<h3>Calculator</h3>

<label>Purchase price</label>
<input id="purchase_price" type="number" value="10">

<label>Shipping</label>
<input id="shipping_cost" type="number" value="5">

<label>Import VAT</label>
<input id="import_vat" type="number" value="2">

<label>Marketplace fee</label>
<input id="marketplace_fee" type="number" value="3">

<label>Sale price</label>
<input id="sale_price" type="number" value="30">

<button id="calcBtn" disabled>Calculate</button>

<pre id="result">---</pre>

<!-- Script a végén -->
<script src="script.js"></script>

</body>
</html>

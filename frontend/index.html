<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dropshipping Calculator</title>

<style>
body {
  font-family: Arial;
  max-width: 500px;
  margin: 40px auto;
}

input, button {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}

button {
  background: #a30f0f;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.card {
  border: 1px solid #ddd;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 15px;
}

pre {
  background: #111;
  color: #0f0;
  padding: 10px;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

</head>

<body>

<h2>Dropshipping Calculator (2026-05-04)</h2>

<!-- History -->>
<h3>My calculations</h3>
<button id="loadBtn">Load history</button>

<ul id="history"></ul>


<!-- LOGIN -->
<div id="authSection" class="card">

  <h3>Login</h3>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="loginBtn">Login</button>
  <button id="registerBtn">Register</button>
  <button id="googleBtn">Login with Google</button>

  <div id="loginStatus">Not logged in</div>

</div>

<!-- APP -->
<div id="appSection" class="card" style="display:none;">

  <h3 id="userEmail"></h3>

  <button id="logoutBtn">Logout</button>

  <hr>

  <label>Purchase price</label>
  <input id="purchase_price" type="number" value="10">

  <label>Shipping</label>
  <input id="shipping_cost" type="number" value="5">

  <label>Import VAT</label>
  <input id="import_vat" type="number" value="2">

  <label>Marketplace fee</label>
  <input id="marketplace_fee" type="number" value="3">

  <label>Sale price</label>
  <input id="sale_price" type="number" value="30">

  <button id="calcBtn">Calculate</button>

  <pre id="result">---</pre>

</div>

<script src="script.js"></script>

</body>
</html>

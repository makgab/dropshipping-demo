<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dropshipping Profit Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 40px auto;
}
input, button {
  padding: 8px;
  margin: 5px 0;
  width: 100%;
}
button {
  background: #a30f0f;
  color: white;
  border: none;
  cursor: pointer;
}
button:hover {
  opacity: 0.9;
}
pre {
  background: #111;
  color: #0f0;
  padding: 10px;
  min-height: 50px;
}
</style>
</head>

<body>

<h2>Dropshipping Profit Calculator (2026-03-03)</h2>

<label>Purchase price (supplier)</label>
<input id="purchase_price" type="number" step="0.01" value="10">

<label>Shipping cost</label>
<input id="shipping_cost" type="number" step="0.01" value="5">

<label>Import VAT</label>
<input id="import_vat" type="number" step="0.01" value="2">

<label>Marketplace fee</label>
<input id="marketplace_fee" type="number" step="0.01" value="3">

<label>Sale price</label>
<input id="sale_price" type="number" step="0.01" value="30">

<button onclick="calculate()">Calculate</button>

<h3>Result:</h3>
<pre id="result">---</pre>

<script>
async function calculate() {

  const data = {
    price: Number(document.getElementById("purchase_price").value),
    shipping: Number(document.getElementById("shipping_cost").value),
    import_vat: Number(document.getElementById("import_vat").value),
    fee: Number(document.getElementById("marketplace_fee").value),
    sales_price: Number(document.getElementById("sale_price").value)
  };

  console.log("Sending:", data);

  try {
    const response = await fetch("https://dropshipping-demo-backend.onrender.com/calculate_profit", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(data)
        });

    if (!response.ok) {
      const txt = await response.text();
      throw new Error(txt);
    }

    const result = await response.json();
    console.log("API result:", result);

    // SAFE parse
    const profit = Number(result.profit || 0);
    const margin = Number(result.profit_margin || 0);

    document.getElementById("result").textContent =
      `Profit: ${result.profit}
      Margin %: ${result.margin_percent}`;

  } catch (err) {
    document.getElementById("result").textContent = "ERROR: " + err.message;
    console.error(err);
  }
}
</script>

</body>
</html>
